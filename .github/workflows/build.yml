name: Build resumes

on:
  push:
    branches: [main]
    paths:
      - "bank/**"
      - "presets/**"
      - "templates/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Key on the runner image so cached .debs always match the libraries already on it.
      - name: Read the runner image version
        id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      # Cached .debs keep a slow Ubuntu mirror from stalling the build.
      - uses: actions/cache@v6
        id: apt-cache
        with:
          path: ~/apt-debs
          key: apt-${{ steps.image.outputs.version }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Download LaTeX and Poppler
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/apt-debs/partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends --download-only \
            -o Dir::Cache::Archives="$HOME/apt-debs" \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended poppler-utils

      # pdfLaTeX from TeX Live is the engine Overleaf uses, so line breaks match it exactly.
      # dpkg runs the install scripts, so TeX formats are built as in a normal apt install.
      - name: Install LaTeX and Poppler
        run: sudo dpkg -i ~/apt-debs/*.deb

      - name: Install the resume tool
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Validate the bank and presets
        run: resume validate

      - name: Test
        env:
          REQUIRE_TEX: "1"
        run: pytest

      - name: Build every preset
        run: |
          rm -rf build
          resume build --all --engine pdflatex --out build

      - name: Check the exact set of PDFs
        run: python scripts/check_build.py build

      - uses: actions/upload-artifact@v5
        with:
          name: resumes
          path: |
            build/*.pdf
            build/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    if: vars.PUBLISH_RESUMES == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: resumes
          path: build

      - name: Check the downloaded PDFs
        working-directory: build
        run: sha256sum --check --strict SHA256SUMS

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py "$GITHUB_SHA" build
